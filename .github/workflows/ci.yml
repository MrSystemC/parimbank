name: Check application

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run install:ci
      - run: npm run check
      - run: npm run build
      - name: Apply local schema twice to verify repeatability
        run: |
          npm run db:migrate:local -- --persist-to .wrangler/ci-state
          npm run db:migrate:local -- --persist-to .wrangler/ci-state
